<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Читальня · интерактивный прототип</title>
<style>
* { box-sizing: border-box }
.page { max-width: 1152px; padding: 0 clamp(18px,5vw,64px) 64px; margin: auto; --rule: #bac1b3; --ink: #284939 }
header { display:flex; align-items:center; gap:14px; padding:24px 0; border-bottom:1px solid var(--rule); font:24px Georgia,serif }
.spines { display:inline-flex; height:30px; align-items:flex-end; gap:3px; color:var(--ink) }
.spines i { display:block; height:80%; width:5px; background:currentColor; border-top:3px double #e6e1ce; border-bottom:4px double #e6e1ce }
.spines i:nth-child(2) { height:100%; width:7px }.spines i:nth-child(3){height:66%;color:#987650}.spines i:nth-child(4){height:89%}.spines i:last-child{transform:rotate(-12deg);margin-left:2px}
main h1.MuiTypography-root { font-size:clamp(48px,7vw,86px); line-height:1.06; letter-spacing:-.052em; margin:clamp(32px,5vw,70px) 0 40px }
.layout { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:clamp(24px,4vw,52px); align-items:start }
.collection, .entry.MuiCard-root { border-top:3px solid var(--ink) }
.section-heading { display:flex; align-items:center; gap:12px; padding:22px 0; border-bottom:1px solid var(--rule) }
.layout h2 { font-size:clamp(24px,2.5vw,32px); line-height:1.2; letter-spacing:-.035em }
.count, li small { border:1px solid var(--rule); border-radius:20px; padding:2px 10px; font:13px/1.6 Arial,sans-serif }
.entry.MuiCard-root { padding:24px; border-radius:0 0 7px 7px; background:#e9ecdf }
.entry .MuiTextField-root { background:#f9faf4 }
.empty { display:grid; justify-items:center; gap:8px; padding:46px 10px; border-bottom:1px solid var(--rule); color:#536155 }
.empty .spines { height:50px; margin-bottom:8px }.empty strong {font:24px Georgia,serif;color:var(--ink)}
ul {list-style:none;margin:0;padding:0}li {display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0;border-bottom:1px solid var(--rule)}
li div {display:grid;gap:5px;min-width:0;overflow-wrap:anywhere}li strong{font:24px Georgia,serif}li span{color:#536155}li small{flex:none}
:focus-visible, .MuiButton-root.Mui-focusVisible {outline:3px solid #916526;outline-offset:3px}
@media(max-width:720px){.layout{display:flex;flex-direction:column;align-items:stretch}.entry{order:-1}header{padding:16px 0}main h1.MuiTypography-root{margin:28px 0}.entry.MuiCard-root{padding:20px}}

</style>
<style>
body{margin:0;background:#f7f4ec;color:#203b31;font:16px Arial,sans-serif}
h1,h2{font-family:Georgia,serif;font-weight:400}h2{margin:0}
form{display:grid;gap:22px}label{display:grid;gap:5px}
input,button,select{font:inherit;padding:12px;border:1px solid #899489;border-radius:5px}
button{background:#2c503e;color:white;cursor:pointer}button:disabled{background:#727971}
nav{margin:32px 0;padding:16px 0;border-top:1px dashed #bac1b3}nav label{max-width:300px}
</style>
<div class="page"><header><span class="spines" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><strong>Читальня</strong></header>
<main><h1 class="MuiTypography-root">Список чтения</h1>
<div class="layout"><section class="collection"><div class="section-heading"><h2>Мои книги</h2><span class="count">0</span></div>
<div class="empty"><strong>Пока нет книг</strong><span>Добавьте первую книгу в список.</span></div><ul></ul></section>
<form class="entry MuiCard-root"><h2>Добавить книгу</h2>
<label>Название *<input id="title" required></label><label>Автор (необязательно)<input id="author"></label>
<button>＋ Добавить книгу</button><output aria-live="polite"></output></form></div></main>
<nav><label>Посмотреть состояние макета<select><option>Пустая библиотека</option><option>Ввод данных</option><option>Сохранение</option><option>Успех</option><option>Ошибка</option></select></label></nav></div>
<script>
const get = selector => document.querySelector(selector)
const state = get('select'), title = get('#title'), author = get('#author')
let timer
function show(index, book = {title:'Солярис', author:'Станислав Лем'}) {
  clearTimeout(timer)
  state.selectedIndex = index
  const filled = [1, 2, 4].includes(index)
  title.value = filled ? book.title : ''
  author.value = filled ? book.author : ''
  title.readOnly = author.readOnly = get('button').disabled = index === 2
  get('button').textContent = index === 2 ? 'Сохраняем…' : '＋ Добавить книгу'
  get('output').textContent = ['', '', '', 'Книга добавлена.', 'Не удалось сохранить книгу. Попробуйте ещё раз.'][index]
  get('output').hidden = index < 3
  get('ul').replaceChildren()
  get('.empty').style.display = index === 3 ? 'none' : ''
  get('.count').textContent = index === 3 ? '1' : '0'
  if (index === 3) {
    const row = document.createElement('li')
    row.innerHTML = '<div><strong></strong><span></span></div><small>К прочтению</small>'
    row.querySelector('strong').textContent = book.title
    row.querySelector('span').textContent = book.author
    get('ul').append(row)
  }
}
state.onchange = () => show(state.selectedIndex)
get('form').onsubmit = event => {
  event.preventDefault()
  if (!title.value.trim()) { get('output').hidden=false; get('output').textContent='Введите название книги.'; title.focus(); return }
  const book = {title:title.value.trim(), author:author.value.trim()}
  show(2, book)
  timer = setTimeout(() => show(3, book), 750)
}
show(0)
</script></html>
