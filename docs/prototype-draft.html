<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Читальня · прототип</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f4ec;color:#213f35;font:16px Arial,sans-serif}main,header,nav{max-width:1080px;margin:auto;padding:20px}header{border-bottom:1px solid #aebbb1;font:bold 24px Georgia}h1{font:clamp(42px,7vw,78px) Georgia;margin:30px 0}h2{font:30px Georgia}section{display:grid;grid-template-columns:2fr 1fr;gap:36px}article,form{padding:24px;border-top:2px solid #264c3e}form{background:#e8eade}input,button,select{padding:10px;font:inherit}input,form button{width:100%;margin:6px 0 18px}form button{background:#285541;color:white;border:0}nav{border-top:1px dashed #aaa;margin-top:40px}label{display:block}small{color:#735738}@media(max-width:700px){section{display:flex;flex-direction:column}form{order:-1}}
</style><header>▥　Читальня</header><main><h1>Список чтения</h1><section><article><h2>Мои книги</h2><p id="list"></p></article><form><h2>Добавить книгу</h2><label>Название<input id="title" required></label><label>Автор (необязательно)<input id="author"></label><button>Добавить книгу</button><p id="message"></p></form></section></main><nav><label>Состояние прототипа <select id="state"><option>Пустая библиотека</option><option>Ввод данных</option><option>Сохранение</option><option>Успех</option><option>Ошибка</option></select></label></nav>
<script>
const state=document.querySelector('select'),titleField=document.querySelector('#title'),author=document.querySelector('#author'),button=document.querySelector('button');
function show(i){state.selectedIndex=i;titleField.value=i&&i!==3?'Солярис':'';author.value=i&&i!==3?'Станислав Лем':'';button.disabled=i===2;button.textContent=i===2?'Сохраняем…':'Добавить книгу';document.querySelector('#list').textContent=i===3?'Солярис　·　Станислав Лем　·　К прочтению':'Пока нет книг';document.querySelector('#message').textContent=['','','','Книга добавлена.','Не удалось сохранить книгу. Попробуйте ещё раз.'][i]}
state.onchange=()=>show(state.selectedIndex);document.querySelector('form').onsubmit=e=>{e.preventDefault();show(2);setTimeout(()=>show(3),750)};show(0)
</script></html>
